name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev, "feat/*" ]
  pull_request:
    branches: [ main, dev, "feat/*" ]

jobs:
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
      - name: Install dependencies
        run: uv sync
      
      - name: Format check (Black)
        run: uv run black --check src/ tests/
      
      - name: Lint (Ruff)
        run: uv run ruff check src/ tests/
      
      - name: Type check (mypy)
        run: uv run mypy src/
      
      - name: Run tests
        run: uv run pytest tests/ -v
      
      - name: Generate coverage report
        run: uv run pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Check coverage threshold
        run: |
          coverage report --fail-under=80
        continue-on-error: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
      - name: Install dependencies
        run: uv sync
      
      - name: Run integration tests
        run: uv run pytest tests/test_integration.py -v -m integration

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      
      - name: Install dependencies
        run: |
          pip install bandit safety
      
      - name: Run Bandit (security linter)
        run: bandit -r src/ -f json -o bandit.json
        continue-on-error: true
      
      - name: Check dependencies with Safety
        run: pip install -r <(pip freeze) && safety check || true
        continue-on-error: true

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [quality, integration-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      
      - name: Install build tools
        run: pip install build
      
      - name: Build package
        run: python -m build

  release:
    name: Create Release (on main)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep "version = " pyproject.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body: |
            Automated release created by GitHub Actions
            
            [Changelog](https://github.com/pmacedo-19/DATechAssessmentSE/blob/main/CHANGELOG.md)
          draft: false
          prerelease: false